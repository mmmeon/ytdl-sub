# Example subscription file for metadata-only downloads with STRM files
#
# Three preset variants available:
# 1. "Metadata Only" - Sequential episode numbering (s01.e001, s01.e002, ...)
# 2. "Metadata Only - Upload Date" - Episode number as YYYYMMDD (s01.e20240115)
# 3. "Metadata Only - By Year" - Season per year, episode as MMDD (s2024.e0115)

# Global overrides - applies to all subscriptions below
__preset__:
  overrides:
    # Base URL for your streaming proxy
    # The video ID will be appended to this URL in the .strm file
    # Example final URL: http://localhost:8096/youtube/dQw4w9WgXcQ
    strm_proxy: "http://localhost:8096/yotube/"

Metadata Only:
  = Documentaries | = TV-PG:
    "NOVA PBS": "https://www.youtube.com/@novapbs"
    "National Geographic": "https://www.youtube.com/@NatGeo"
    "Cosmos - What If": "https://www.youtube.com/playlist?list=PLZdXRHYAVxTJno6oFF9nLGuwXNGYHmE8U"

  = Gardening | = TV-Y:
    # TV Show presets support multiple URLs as a list
    "Gardening with Ciscoe":
      - "https://www.youtube.com/@gardeningwithciscoe4430"
      - "https://www.youtube.com/playlist?list=PLi8V8UemxeG6lo5if5H5g5EbsteELcb0_"
      - "https://www.youtube.com/playlist?list=PLsJlQSR-KjmaQqqJ9jq18cF6XXXAR4kyn"
      - "https://www.youtube.com/watch?v=2vq-vPubS5I"

################################################################################
# OPTION 2: Upload Date as Episode Number
# All videos in Season 01, episodes numbered as YYYYMMDD
################################################################################
"Metadata Only - Upload Date":

  = Documentary:
    "Nature": "https://www.youtube.com/@natgeo"

################################################################################
# OPTION 3: Organized by Year
# Season per year (2023, 2024), episodes as MMDD
################################################################################
"Metadata Only - By Year":

  = News:
    "BBC News": "https://www.youtube.com/@BBCNews"

