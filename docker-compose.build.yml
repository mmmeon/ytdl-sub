# Docker Compose configuration for building and testing ytdl-sub images
# 
# Usage:
#   docker-compose -f docker-compose.build.yml build
#   docker-compose -f docker-compose.build.yml up test
#   docker-compose -f docker-compose.build.yml run ytdl-sub --help

version: '3.8'

services:
  # Build environment setup
  builder:
    image: python:3.11-slim
    volumes:
      - .:/workspace
      - build-cache:/workspace/.venv
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "
        apt-get update && apt-get install -y git make curl &&
        curl -LsSf https://astral.sh/uv/install.sh | sh &&
        export PATH=\"$$HOME/.cargo/bin:$$PATH\" &&
        uv venv .venv &&
        . .venv/bin/activate &&
        uv pip install build &&
        cat > .venv/bin/pip << 'EOF'
      #!/bin/bash
      exec uv pip \"$$@\"
      EOF
        chmod +x .venv/bin/pip &&
        ln -sf pip .venv/bin/pip3 &&
        make wheel &&
        make docker_stage
      "
  
  # Headless image
  ytdl-sub:
    build:
      context: ./docker
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
      cache_from:
        - ytdl-sub:latest
    image: ytdl-sub:local
    container_name: ytdl-sub
    volumes:
      - ./config:/config
      - ./downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    restart: unless-stopped
    depends_on:
      builder:
        condition: service_completed_successfully
  
  # Ubuntu variant
  ytdl-sub-ubuntu:
    build:
      context: ./docker
      dockerfile: Dockerfile.ubuntu
    image: ytdl-sub:ubuntu
    volumes:
      - ./config:/config
      - ./downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    depends_on:
      builder:
        condition: service_completed_successfully
  
  # GUI variant
  ytdl-sub-gui:
    build:
      context: ./docker
      dockerfile: Dockerfile.gui
    image: ytdl-sub:gui
    volumes:
      - ./config:/config
      - ./downloads:/downloads
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - DISPLAY=${DISPLAY:-:0}
    depends_on:
      builder:
        condition: service_completed_successfully
  
  # Test service to verify the built image
  test:
    image: ytdl-sub:local
    volumes:
      - ./test-config:/config
    command: >
      bash -c "
        echo '=== Testing ytdl-sub ===' &&
        ytdl-sub --version &&
        ytdl-sub --help &&
        echo '=== Creating test config ===' &&
        mkdir -p /config &&
        cat > /config/config.yaml << 'EOF'
      configuration:
        working_directory: \"/config\"
      EOF
        echo '=== Running view command ===' &&
        ytdl-sub view &&
        echo '=== All tests passed! ==='
      "
    depends_on:
      - ytdl-sub

volumes:
  build-cache:
    driver: local

networks:
  default:
    name: ytdl-sub-build
    driver: bridge
